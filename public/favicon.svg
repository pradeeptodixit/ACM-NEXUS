<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#080E1E" />
  <circle cx="32" cy="32" r="22" stroke="#1E3A75" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="14" stroke="url(#nexusGrad)" stroke-width="2" />
  <!-- Connecting lines -->
  <line x1="32" y1="18" x2="44" y2="38" stroke="#38BDF8" stroke-width="1.5" opacity="0.7" />
  <line x1="44" y1="38" x2="20" y2="38" stroke="#38BDF8" stroke-width="1.5" opacity="0.7" />
  <line x1="20" y1="38" x2="32" y2="18" stroke="#38BDF8" stroke-width="1.5" opacity="0.7" />
  <!-- Nodes -->
  <circle cx="32" cy="18" r="4.5" fill="#22D3EE" filter="url(#glow)" />
  <circle cx="44" cy="38" r="4" fill="#38BDF8" />
  <circle cx="20" cy="38" r="4" fill="#818CF8" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
</svg>
